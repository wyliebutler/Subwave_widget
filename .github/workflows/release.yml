name: Build & Release (Windows + macOS Apple Silicon)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Build Windows Installer & Portable EXE
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubWave-Widget-Windows-x64
          path: |
            dist/SubWave-Widget-Setup.exe
            dist/SubWave-Widget-Portable.exe

  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Build macOS arm64 DMG & ZIP
        run: |
          npm run dist:mac
          codesign --verify --deep --strict "dist/mac-arm64/SubWave Widget.app"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubWave-Widget-macOS-arm64
          path: |
            dist/SubWave-Widget-arm64.dmg
            dist/SubWave-Widget-arm64.zip

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/SubWave-Widget-Setup.exe
            release-assets/SubWave-Widget-Portable.exe
            release-assets/SubWave-Widget-arm64.dmg
            release-assets/SubWave-Widget-arm64.zip
